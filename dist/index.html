<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>TradingVue Demo</title>
    <style>
    </style>
    <!--
      Synchronous preboot: wraps window.WebSocket BEFORE the deferred bundle
      script runs, so webpack-dev-server's HMR client (auto-injected at the
      top of the bundle) constructs its `/ws` socket through our wrapper.

      Purpose: when the app has an active live-feed WebSocket subscription
      (signalled via window.__tvw_wsConnected by the WsManager mixin), drop
      reload-type messages arriving on the dev-server channel so the page
      keeps streaming instead of being force-reloaded by a data/*.json
      resave. F5 / browser reload still works (browser-side, not through
      WebSocket). Only /ws (the dev-server HMR endpoint) is wrapped; the
      app's own live-feed sockets connect to different paths and are
      untouched.

      Modern browsers reject Object.defineProperty on Location.reload
      ([LegacyUnforgeable]), so we intercept upstream at the WebSocket
      message layer instead.
    -->
    <script>
    (function () {
        if (typeof window === 'undefined' || !window.WebSocket) return
        if (window.__tvw_websocketPatched) return
        window.__tvw_websocketPatched = true

        var OrigWS = window.WebSocket
        var RELOAD_TYPES = { 'static-changed': 1, 'content-changed': 1, 'liveReload': 1, 'reload': 1 }

        function isDevServerHmrUrl(urlStr) {
            if (!urlStr) return false
            var slash = urlStr.indexOf('/', urlStr.indexOf('//') + 2)
            var path = slash >= 0 ? urlStr.slice(slash) : urlStr
            return path === '/ws' || path.indexOf('/ws?') === 0 || path.indexOf('/ws#') === 0
        }

        function Wrapped(url, protocols) {
            var ws = protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url)
            var urlStr = typeof url === 'string' ? url : (url && url.toString ? String(url) : '')
            if (!isDevServerHmrUrl(urlStr)) return ws
            ws.addEventListener('message', function (event) {
                if (!window.__tvw_wsConnected) return
                try {
                    var raw = typeof event.data === 'string' ? event.data : ''
                    if (raw.indexOf('"type"') < 0) return
                    var parsed
                    try { parsed = JSON.parse(raw) } catch (e) { return }
                    if (parsed && RELOAD_TYPES[parsed.type]) {
                        event.stopImmediatePropagation()
                        console.log('[preboot] Suppressed dev-server', parsed.type,
                                    '— live feed active. F5 to force reload.')
                    }
                } catch (e) { /* swallow */ }
            }, true)
            return ws
        }
        Wrapped.prototype = OrigWS.prototype
        try { Object.setPrototypeOf(Wrapped, OrigWS) } catch (e) {}
        Wrapped.CONNECTING = OrigWS.CONNECTING
        Wrapped.OPEN = OrigWS.OPEN
        Wrapped.CLOSING = OrigWS.CLOSING
        Wrapped.CLOSED = OrigWS.CLOSED
        window.WebSocket = Wrapped
    })()
    </script>
<script defer src="main.js"></script></head>

<body>
    <!-- Our vue app will be mounted on this DOM element -->
    <div id="app"></div>
    <!-- Bundle will be injected below -->
</body>

</html>
