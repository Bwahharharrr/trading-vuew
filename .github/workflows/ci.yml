name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # ── Phase 1 quality gates ────────────────────────────────────────────
      - name: Typecheck (vue-tsc)
        run: npm run typecheck

      - name: Lint (eslint — fails on errors, warnings allowed)
        run: npm run lint

      - name: Unit + golden + visual + ssr tests
        run: npm test

      - name: Build (Vite lib: umd + umd.min + es + .d.ts)
        run: npm run build

      - name: Bundle-size budget
        run: npm run size
